name: Verify

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  TANDEMOUNT_CACHE: ${{ github.workspace }}/.agents/sdk-cache

jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: make test-tools check-python

  plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {minecraft: '1.7.10', platform: paper}
          - {minecraft: '1.12.2', platform: paper}
          - {minecraft: '1.16.5', platform: paper}
          - {minecraft: '1.17.1', platform: paper}
          - {minecraft: '1.20.4', platform: paper}
          - {minecraft: '1.20.5', platform: paper}
          - {minecraft: '1.21.11', platform: paper}
          - {minecraft: '26.3', platform: paper}
          - {minecraft: '26.3', platform: folia}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: |
            8
            16
            17
            21
            25
      - name: Prepare exact upstream SDKs
        run: python3 tools/cache_servers.py --platforms paper folia --versions 1.12.2 '${{ matrix.minecraft }}' --bootstrap --jobs 2
      - name: Build exact release and separate fixture
        run: python3 tools/plugin-build.py --all --fixture
      - name: Run actual native server and vanilla clients
        env:
          TEST_MINECRAFT: ${{ matrix.minecraft }}
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from cache_servers import java_for
          mc = os.environ['TEST_MINECRAFT']
          target = next(t for t in json.loads(Path('platforms.json').read_text())['targets'] if t['minecraft'] == mc)
          java_home = Path(java_for(target['java'])).parent.parent
          subprocess.run(['python3', 'tools/plugin-runtime.py', '--minecraft', mc,
                          '--platform', os.environ['TEST_PLATFORM'], '--java-home', str(java_home),
                          '--accept-eula', '--timeout', '240'], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plugin-${{ matrix.platform }}-${{ matrix.minecraft }}
          include-hidden-files: true
          path: |
            .agents/plugin-build/*.jar
            .agents/plugin-build/compile.json
            .agents/plugin-evidence/**

  legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '8'
      - name: Build exact legacy Forge artifacts
        run: python3 tools/legacy-build.py --java "$JAVA_HOME"
      - name: Run native lifecycle and vanilla protocol tests
        run: python3 tools/legacy-native-test.py --java "$JAVA_HOME" --accept-eula
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: legacy-forge
          include-hidden-files: true
          path: |
            .agents/sdk-cache/legacy/artifacts/*.jar
            .agents/sdk-cache/legacy/artifacts/*.json
            .agents/legacy-native-results.json

  modern:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [fabric, forge, neoforge]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: |
            8
            16
            17
            21
            25
      - name: Build every available exact target for this loader
        run: python3 tools/modern-build.py --all --platform '${{ matrix.platform }}'
      - name: Native behavior and vanilla-client boundary checks
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          selected = {'1.16.5','1.17.1','1.18.2','1.19.4','1.20.4','1.20.5','1.21.1','1.21.9','1.21.11','26.1','26.3'}
          platform = os.environ['TEST_PLATFORM']
          for target in json.loads(Path('platforms.json').read_text())['targets']:
              mc = target['minecraft']
              if mc not in selected or not target['platforms'][platform]['available']:
                  continue
              tool = 'tools/cache_fabric_servers.py' if platform == 'fabric' else 'tools/cache_fml_servers.py'
              arguments = ['python3',tool,'--versions',mc,'--jobs','1']
              if platform != 'fabric':
                  arguments += ['--platforms',platform]
              subprocess.run(arguments,check=True)
              subprocess.run(['python3','tools/modern-native.py','--minecraft',mc,'--platform',platform,'--network-test','--restart-test','--accept-eula','--timeout','240'],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: modern-${{ matrix.platform }}
          include-hidden-files: true
          path: |
            mods/modern/build/*.jar
            .agents/modern-native/*.json
