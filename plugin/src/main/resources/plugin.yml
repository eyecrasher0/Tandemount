name: Tandemount
version: 1.0.0
main: dev.eyecrasher.tandemount.TandemountPlugin
author: EyeCrasher
description: Share an ordinary horse with a second rider. Server only.
website: https://github.com/EyeCrasher/Tandemount
folia-supported: true
api-version: '1.13'
commands:
